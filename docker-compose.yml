version: '3.8'

services:

  redis:
    image: redis:7-alpine
    container_name: intellihire-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: intellihire-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API endpoint
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tạo bucket "resume-files" tự động sau khi MinIO sẵn sàng
  minio-init:
    image: minio/mc:latest
    container_name: intellihire-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/resume-files;
      mc anonymous set download local/resume-files;
      echo 'Bucket resume-files created successfully';
      "
    restart: on-failure

volumes:
  redis_data:
  minio_data:
